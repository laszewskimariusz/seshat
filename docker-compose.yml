version: '3.9'

services:
  app:
    build: .
    container_name: seshat
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - seshat-data:/app/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/seshat.db}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  seshat-data:
    name: seshat-data
